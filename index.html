<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Someone Remains</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%236fd08c'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; user-select: none; }
      #game { position: fixed; inset: 0; }
      canvas { display: block; cursor: crosshair; }
      .overlay { position: fixed; pointer-events: none; font-family: system-ui, sans-serif; text-shadow: 0 1px 4px #000; }
      #counter {
        top: 12px; left: 0; right: 0; text-align: center;
        font-weight: 600; font-size: 18px; letter-spacing: .06em; color: #cfe8d5;
      }
      #life { top: 40px; left: 0; right: 0; text-align: center; font-size: 13px; color: #8fa3ad; }
      #boss { top: 66px; left: 50%; transform: translateX(-50%); width: 360px; display: none; text-align: center; font-size: 11px; letter-spacing: .2em; color: #ff9aa0; }
      #boss .bar { height: 8px; margin-top: 4px; }
      #bossFill { height: 100%; width: 100%; background: #c0272d; }
      #minimap { position: fixed; top: 12px; right: 12px; border: 1px solid #2a323a; border-radius: 8px; background: #05070a; pointer-events: none; opacity: .92; }
      #minimap.large { top: 50%; right: auto; left: 50%; transform: translate(-50%, -50%); opacity: .95; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
      #ammo { bottom: 80px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 13px; color: #e8e2c8; white-space: nowrap; }
      #ammo.empty { color: #ff6b6b; }
      #ammo small { display: block; color: #6d7a83; font-size: 11px; margin-top: 2px; }
      #prompt { bottom: 140px; left: 50%; transform: translateX(-50%); display: none; text-align: center; font-size: 14px; color: #fff; }
      #prompt .bar { width: 160px; margin: 6px auto 0; }
      #promptFill { height: 100%; width: 0; background: #ffd166; }
      #toasts { bottom: 100px; left: 14px; font-size: 13px; line-height: 1.5; }
      #toasts div { color: #cfe8d5; transition: opacity .6s; }
      #bagPanel { top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; width: 360px; padding: 14px; background: rgba(15,18,22,.94); border: 1px solid #2a323a; border-radius: 8px; color: #cfd8dc; }
      #bagPanel h3 { margin: 0 0 8px; font-size: 14px; letter-spacing: .15em; font-weight: 600; }
      #bagGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .slot { border: 1px solid #2a323a; border-radius: 6px; padding: 6px 8px; min-height: 36px; font-size: 12px; }
      .slot.empty { color: #3d474f; }
      .slot b { display: block; font-size: 15px; }
      #safe { bottom: 62px; left: 50%; transform: translateX(-50%); display: none; font-size: 12px; letter-spacing: .25em; color: #3ddc84; }
      #bars { bottom: 28px; left: 50%; transform: translateX(-50%); width: 280px; }
      .bar { height: 10px; background: rgba(255,255,255,.08); border-radius: 5px; overflow: hidden; margin-top: 6px; }
      .bar.dash { height: 5px; }
      #hpFill { height: 100%; width: 100%; background: #e5484d; }
      #dashFill { height: 100%; width: 100%; background: #36d1ff; }
      #death {
        inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: rgba(40, 0, 0, .45); color: #ffd5d5;
      }
      #death b { font-size: 34px; letter-spacing: .08em; }
      #debug { top: 10px; left: 12px; font: 12px/1.5 ui-monospace, monospace; color: #8fa3ad; white-space: pre; }
      #help { bottom: 10px; left: 12px; font-size: 12px; color: #5b6770; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="viewer"></div>
    <div id="counter" class="overlay"></div>
    <div id="life" class="overlay"></div>
    <div id="boss" class="overlay">COLOSSE<div class="bar"><div id="bossFill"></div></div></div>
    <div id="safe" class="overlay">REFUGE</div>
    <div id="ammo" class="overlay"></div>
    <div id="prompt" class="overlay"><span id="promptText"></span><div class="bar"><div id="promptFill"></div></div></div>
    <div id="toasts" class="overlay"></div>
    <div id="bagPanel" class="overlay"><h3>SAC</h3><div id="bagGrid"></div></div>
    <div id="bars" class="overlay"><div class="bar"><div id="hpFill"></div></div><div class="bar dash"><div id="dashFill"></div></div></div>
    <div id="death" class="overlay"><b>VOUS ÊTES MORT</b><span id="deathTimer"></span></div>
    <div id="debug" class="overlay"></div>
    <div id="help" class="overlay">ZQSD / WASD déplacer · souris viser · clic gauche tirer · clic droit corps à corps · R/T tourner la caméra (Y : remettre) · F soigner · E fouiller · Tab sac · espace esquive · M carte · F3 infos</div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
